services:
  - type: web
    name: db-ass-backend
    runtime: python
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn -w 4 -b 0.0.0.0:$PORT App:app
    envVars:
      - key: FLASK_ENV
        value: production
      - key: DB_HOST
        value: your-db-host
      - key: DB_PORT
        value: "3306"
      - key: DB_USER
        value: your-db-user
      - key: DB_PASSWORD
        value: your-db-password
      - key: DB_NAME
        value: your-db-name
      - key: JWT_SECRET_KEY
        value: your-secret-key-here

  - type: static_site
    name: db-ass-frontend
    rootDir: frontend
    buildCommand: npm install && npm run build
    staticPublishPath: dist

  - type: static_site
    name: db-ass-frontend-customer
    rootDir: frontend_customer
    buildCommand: npm install && npm run build
    staticPublishPath: dist
